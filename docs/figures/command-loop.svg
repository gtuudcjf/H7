<svg xmlns="http://www.w3.org/2000/svg" width="680" height="980" viewBox="0 0 680 980" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="980" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="19" font-weight="bold" fill="#1565C0">一条命令走一圈（闭环）</text>
  <text x="20" y="56" font-size="12" fill="#666666">TwinCAT 3 PLC ⇄ Device 2 (EtherCAT) ⇄ Box 1 (LAN9252) ⇄ STM32H743</text>

  <!-- 左右泳道标题 -->
  <rect x="20" y="70" width="300" height="26" fill="#E3F2FD"/>
  <text x="170" y="88" font-size="13" font-weight="bold" fill="#1565C0" text-anchor="middle">主站侧 · PC（TwinCAT 3）</text>
  <rect x="360" y="70" width="300" height="26" fill="#FFF3E0"/>
  <text x="510" y="88" font-size="13" font-weight="bold" fill="#E65100" text-anchor="middle">从站侧 · 硬件（H743 + LAN9252）</text>

  <!-- ① -->
  <rect x="40" y="120" width="260" height="62" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="56" y="143" font-size="13" font-weight="bold" fill="#1B5E20">① MAIN (PRG)</text>
  <text x="56" y="163" font-size="11.5" fill="#333333">bStart / rDemandRpm 等内部变量</text>
  <text x="56" y="178" font-size="11" fill="#666666">逐周期打包赋值</text>

  <line x1="170" y1="182" x2="170" y2="212" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="182" y="202" font-size="11" fill="#666666">PlcTask 输出刷新</text>

  <!-- ② -->
  <rect x="40" y="216" width="260" height="68" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="56" y="240" font-size="13" font-weight="bold" fill="#1B5E20">② PlcTask Outputs</text>
  <text x="56" y="259" font-size="11.5" fill="#333333">ControlWord</text>
  <text x="56" y="274" font-size="11.5" fill="#333333">TargetSpeed / CommandSequence</text>

  <line x1="170" y1="284" x2="170" y2="322" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="182" y="308" font-size="11" fill="#666666">Mappings 映射（PLC 实例 ⇄ Device 2）</text>

  <!-- ③ -->
  <rect x="340" y="326" width="300" height="62" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="356" y="349" font-size="13" font-weight="bold" fill="#BF360C">③ Box 1 · Motor outputs（RxPDO，3 项）</text>
  <text x="356" y="369" font-size="11.5" fill="#333333">主 → 从：下行过程数据</text>
  <text x="356" y="384" font-size="11" fill="#666666">ControlWord / TargetSpeed / CommandSequence</text>
  <line x1="250" y1="300" x2="338" y2="340" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,3"/>

  <line x1="490" y1="388" x2="490" y2="432" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="502" y="414" font-size="11" fill="#666666">EtherCAT 帧 → LAN9252 (ESC) → SPI1</text>

  <!-- ④ -->
  <rect x="340" y="436" width="300" height="96" rx="6" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="356" y="459" font-size="13" font-weight="bold" fill="#BF360C">④ STM32H743（设备侧）</text>
  <text x="356" y="479" font-size="11.5" fill="#333333">解析 ControlWord / TargetSpeed</text>
  <text x="356" y="497" font-size="11.5" fill="#333333">→ 电流环（Id / Iq）→ TIM8 六路 PWM</text>
  <text x="356" y="515" font-size="11.5" fill="#333333">→ DRV8323 → 电机</text>
  <text x="356" y="531" font-size="11" fill="#666666">同时把 StatusWord / CycleCounter / MotorFault</text>
  <text x="356" y="546" font-size="11" fill="#666666">/ AcceptedSequence 写入 TxPDO</text>

  <line x1="490" y1="532" x2="490" y2="576" stroke="#1565C0" stroke-width="2" marker-end="url(#arb)"/>
  <text x="502" y="558" font-size="11" fill="#1565C0">TxPDO 回读 → EtherCAT 帧上行</text>

  <!-- ⑤ -->
  <rect x="340" y="580" width="300" height="62" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="356" y="603" font-size="13" font-weight="bold" fill="#0D47A1">⑤ Box 1 · Motor inputs（TxPDO，8 项）</text>
  <text x="356" y="623" font-size="11.5" fill="#333333">从 → 主：上行过程数据</text>
  <text x="356" y="638" font-size="11" fill="#666666">StatusWord / CycleCounter / ActualSpeed / ActualIq …</text>

  <line x1="250" y1="640" x2="338" y2="700" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="170" y1="682" x2="170" y2="716" stroke="#1565C0" stroke-width="2" marker-end="url(#arb)"/>
  <text x="60" y="704" font-size="11" fill="#1565C0">Mappings（同一条映射的反向）</text>

  <!-- ⑥ -->
  <rect x="40" y="720" width="260" height="62" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="56" y="743" font-size="13" font-weight="bold" fill="#0D47A1">⑥ PlcTask Inputs</text>
  <text x="56" y="763" font-size="11.5" fill="#333333">StatusWord · ActualSpeed ·</text>
  <text x="56" y="778" font-size="11.5" fill="#333333">MotorFault · AcceptedSequence …</text>

  <line x1="170" y1="782" x2="170" y2="818" stroke="#1565C0" stroke-width="2" marker-end="url(#arb)"/>

  <!-- ⑦ -->
  <rect x="40" y="822" width="260" height="68" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="56" y="846" font-size="13" font-weight="bold" fill="#0D47A1">⑦ MAIN 读取并解位</text>
  <text x="56" y="865" font-size="11.5" fill="#333333">更新 nPhase / bLocalFault /</text>
  <text x="56" y="880" font-size="11.5" fill="#333333">bHealthy 等内部状态</text>

  <!-- 回到 ① 的闭环 -->
  <path d="M40,856 L18,856 L18,151 L40,151" fill="none" stroke="#1565C0" stroke-width="2" marker-end="url(#arb)"/>
  <text x="14" y="505" font-size="11" fill="#1565C0" transform="rotate(-90 14 505)" text-anchor="middle">闭环回到 ①（下一周期）</text>

  <!-- 说明 -->
  <rect x="20" y="910" width="640" height="56" rx="5" fill="#FAFAFA" stroke="#BBBBBB" stroke-dasharray="4,3"/>
  <text x="34" y="931" font-size="11.5" fill="#333333">① → ④ 为下行（绿色 → 橙色），④ → ⑦ 为上行（蓝色），⑦ 回到 ① 构成闭环。</text>
  <text x="34" y="950" font-size="11.5" fill="#333333">「OP 正常」≠「电机在转」：①~④ 只证明帧走通，是否真输出要看 ⑤~⑦ 回读的 StatusWord 与 CycleCounter。</text>
</svg>
